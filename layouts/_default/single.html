{{ define "main" }}
<article class="py-16 md:py-24">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <header class="mb-12">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-gray-900 mb-4">{{ .Title }}</h1>
      {{ with .Params.description }}
        <p class="text-lg md:text-xl text-gray-600">{{ . }}</p>
      {{ end }}
      {{ if .Date }}
        <time class="text-sm text-gray-500 mt-4 block" datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "January 2, 2006" }}
        </time>
      {{ end }}
    </header>
    <div class="prose prose-lg max-w-none prose-headings:text-gray-900 prose-a:text-rally-600 hover:prose-a:text-rally-700">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
