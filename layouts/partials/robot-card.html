<a href="{{ .RelPermalink }}" class="group block rounded-2xl border border-gray-200 hover:border-rally-200 hover:shadow-xl transition-all duration-300 overflow-hidden bg-white">
  <!-- Image placeholder or actual image -->
  {{ if .Params.image }}
    <img src="{{ .Params.image }}" alt="{{ .Title }}" class="w-full h-56 object-cover" loading="lazy">
  {{ else }}
    <div class="w-full h-56 bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center">
      <div class="text-center">
        <svg class="w-12 h-12 text-gray-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437l1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008z"/>
        </svg>
        <p class="text-sm text-gray-400">Photo coming soon</p>
      </div>
    </div>
  {{ end }}

  <div class="p-6">
    <!-- Year badge -->
    <div class="flex items-center justify-between mb-3">
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-rally-100 text-rally-700">
        {{ .Params.year }}
      </span>
      {{ with .Params.game }}
        <span class="text-xs text-gray-400 font-medium">{{ . }}</span>
      {{ end }}
    </div>

    <!-- Robot name -->
    <h2 class="text-2xl font-bold text-gray-900 group-hover:text-rally-600 transition-colors mb-2">
      {{ .Title }}
    </h2>

    {{ with .Params.description }}
      <p class="text-gray-600 text-sm leading-relaxed">{{ . }}</p>
    {{ end }}

    <span class="inline-flex items-center text-rally-600 font-semibold text-sm mt-4 group-hover:text-rally-700 transition-colors">
      Learn more
      <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
      </svg>
    </span>
  </div>
</a>
