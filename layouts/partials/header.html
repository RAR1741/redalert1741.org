<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-100">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo / Team Name -->
      <a href="/" class="flex items-center group">
        <img src="/images/logo.png" alt="Red Alert Robotics" class="h-8 w-auto">
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        {{ range .Site.Menus.main }}
          {{ if .HasChildren }}
            <div class="relative group">
              <a href="{{ .URL }}"
                 class="text-sm font-medium transition-colors inline-flex items-center gap-1
                        {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
                          text-rally-600
                        {{ else }}
                          text-gray-600 hover:text-rally-600
                        {{ end }}">
                {{ .Name }}
                <svg class="w-3.5 h-3.5 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </a>
              <div class="absolute left-0 top-full pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
                <div class="bg-white rounded-lg shadow-lg border border-gray-100 py-2 min-w-[180px]">
                  {{ range .Children }}
                    <a href="{{ .URL }}"
                       class="block px-4 py-2 text-sm transition-colors
                              {{ if $.IsMenuCurrent "main" . }}
                                text-rally-600 bg-rally-50
                              {{ else }}
                                text-gray-600 hover:text-rally-600 hover:bg-gray-50
                              {{ end }}">
                      {{ .Name }}
                    </a>
                  {{ end }}
                </div>
              </div>
            </div>
          {{ else }}
            <a href="{{ .URL }}"
               class="text-sm font-medium transition-colors
                      {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
                        text-rally-600
                      {{ else }}
                        text-gray-600 hover:text-rally-600
                      {{ end }}">
              {{ .Name }}
            </a>
          {{ end }}
        {{ end }}
      </div>

      <!-- Mobile Menu Button -->
      <button
        onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
        class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors"
        aria-label="Toggle navigation menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-gray-100 mt-2 pt-2">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"
           class="block py-2.5 px-2 rounded-lg text-base font-medium text-gray-700 hover:text-rally-600 hover:bg-rally-50 transition-colors">
          {{ .Name }}
        </a>
        {{ if .HasChildren }}
          {{ range .Children }}
            <a href="{{ .URL }}"
               class="block py-2 px-6 rounded-lg text-sm text-gray-500 hover:text-rally-600 hover:bg-rally-50 transition-colors">
              {{ .Name }}
            </a>
          {{ end }}
        {{ end }}
      {{ end }}
    </div>
  </nav>
</header>
