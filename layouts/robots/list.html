{{ define "main" }}

<!-- ============================================ -->
<!-- ROBOTS HERO                                  -->
<!-- ============================================ -->
<section class="relative bg-gray-900 overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-br from-rally-950 via-gray-900 to-gray-800"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-28">
    <div class="text-center">
      <p class="text-rally-400 font-semibold text-sm mb-3 tracking-widest uppercase">Our Machines</p>
      <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight mb-6">Our Robots</h1>
      <p class="text-xl text-gray-300 max-w-2xl mx-auto">
        {{ .Params.description }}
      </p>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 right-0">
    <svg viewBox="0 0 1440 60" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full" preserveAspectRatio="none">
      <path d="M0 60L1440 60L1440 0C1440 0 1200 45 720 45C240 45 0 0 0 0L0 60Z" fill="white"/>
    </svg>
  </div>
</section>

<!-- ============================================ -->
<!-- ROBOTS GRID                                  -->
<!-- ============================================ -->
<section class="py-16 md:py-24 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    {{ $robots := .Pages.ByParam "year" | collections.Reverse }}
    {{ if $robots }}
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {{ range $robots }}
          {{ partial "robot-card.html" . }}
        {{ end }}
      </div>
    {{ else }}
      <p class="text-center text-gray-500 text-lg">Robot pages coming soon!</p>
    {{ end }}
  </div>
</section>

{{ end }}
