{{ define "main" }}
<article>
  <!-- Post Header -->
  <section class="relative bg-gray-900 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-rally-950 via-gray-900 to-gray-800"></div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-24">
      <div class="max-w-3xl mx-auto text-center">
        {{ with .Params.tags }}
          <div class="flex flex-wrap items-center justify-center gap-2 mb-4">
            {{ range . }}
              <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-rally-600/20 text-rally-300 border border-rally-500/30">
                {{ . }}
              </span>
            {{ end }}
          </div>
        {{ end }}
        <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">{{ .Title }}</h1>
        {{ if .Date }}
          <time class="text-gray-400 text-sm" datetime="{{ .Date.Format "2006-01-02" }}">
            {{ .Date.Format "January 2, 2006" }}
          </time>
        {{ end }}
      </div>
    </div>
    <div class="absolute bottom-0 left-0 right-0">
      <svg viewBox="0 0 1440 60" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full" preserveAspectRatio="none">
        <path d="M0 60L1440 60L1440 0C1440 0 1200 45 720 45C240 45 0 0 0 0L0 60Z" fill="white"/>
      </svg>
    </div>
  </section>

  <!-- Post Content -->
  <section class="py-16 md:py-24 bg-white">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
      {{ with .Params.image }}
        <img src="{{ . }}" alt="{{ $.Title }}" class="w-full rounded-2xl mb-10 shadow-lg" loading="lazy">
      {{ end }}
      <div class="prose prose-lg max-w-none prose-headings:text-gray-900 prose-a:text-rally-600 hover:prose-a:text-rally-700">
        {{ .Content }}
      </div>

      <!-- Post Footer -->
      <div class="mt-12 pt-8 border-t border-gray-200">
        <a href="/blog/" class="inline-flex items-center text-rally-600 font-semibold hover:text-rally-700 transition-colors">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
          </svg>
          Back to Blog
        </a>
      </div>
    </div>
  </section>
</article>
{{ end }}
